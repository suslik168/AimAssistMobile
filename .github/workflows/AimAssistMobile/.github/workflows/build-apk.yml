name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          mkdir -p source
          unzip -q AimAssistMobile-Android-Source.zip -d source

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: gradle --no-daemon assembleDebug
        working-directory: source/AimAssistMobile

      - uses: actions/upload-artifact@v4
        with:
          name: AimAssist-APK
          path: source/AimAssistMobile/app/build/outputs/apk/debug/app-debug.apk
